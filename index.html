<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پیام‌رسان آریا | Arya</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active">
      <div class="auth-card">
        <div class="logo">
          <div class="logo-icon">آ</div>
          <h1>آریا</h1>
          <p>پیام‌رسان مدرن با فضای ابری</p>
        </div>
        <div class="form-group">
          <label>شماره موبایل</label>
          <input type="tel" id="phone-input" placeholder="09xxxxxxxxx" maxlength="11" />
        </div>
        <div class="form-group">
          <label>نام نمایشی (اختیاری)</label>
          <input type="text" id="name-input" placeholder="نام شما" />
        </div>
        <button id="login-btn" class="btn primary">ورود / ثبت‌نام</button>
        <p class="hint">با ورود، حساب کاربری شما ایجاد یا ثبت می‌شود</p>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-screen" class="screen">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="user-info">
            <div class="avatar" id="user-avatar">?</div>
            <div>
              <div class="user-name" id="user-name">کاربر</div>
              <div class="user-status">آنلاین</div>
            </div>
          </div>
          <button id="admin-btn" class="icon-btn" title="پنل ادمین" style="display:none">⚙</button>
        </div>
        <div class="search-box">
          <input type="text" id="search-chats" placeholder="جستجو..." />
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="chats">چت‌ها</button>
          <button class="tab" data-tab="channels">کانال‌ها</button>
        </div>
        <div id="chat-list" class="list"></div>
        <div class="sidebar-footer">
          <button id="new-chat-btn" class="btn secondary small">+ چت جدید</button>
          <button id="new-channel-btn" class="btn secondary small">+ کانال جدید</button>
          <button id="logout-btn" class="btn danger small">خروج</button>
        </div>
      </aside>

      <main class="chat-area">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">آ</div>
          <h2>به آریا خوش آمدید</h2>
          <p>یک چت یا کانال انتخاب کنید</p>
        </div>

        <div id="chat-view" class="chat-view" style="display:none">
          <header class="chat-header">
            <div class="chat-title">
              <span id="chat-name">چت</span>
              <span id="chat-badge" class="badge" style="display:none"></span>
            </div>
            <div class="chat-actions">
              <button id="verify-btn" class="btn small" style="display:none">تیک تأیید</button>
            </div>
          </header>
          <div id="messages" class="messages"></div>
          <div class="composer">
            <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." />
            <button id="send-btn" class="btn primary">ارسال</button>
          </div>
        </div>
      </main>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="modal" style="display:none">
      <div class="modal-content">
        <h2>پنل سازنده</h2>
        <p class="hint">مدیریت تیک‌های تأیید کانال‌ها و پاک‌سازی داده‌ها</p>
        <div class="form-group">
          <label>انتخاب کانال برای تیک</label>
          <select id="admin-channel-select"></select>
        </div>
        <div class="form-group">
          <label>نوع تیک</label>
          <select id="badge-type">
            <option value="none">بدون تیک</option>
            <option value="blue">تیک آبی (رسمی)</option>
            <option value="gold">تیک طلایی</option>
            <option value="purple">تیک بنفش</option>
            <option value="green">تیک سبز</option>
          </select>
        </div>
        <div class="modal-actions">
          <button id="apply-badge-btn" class="btn primary">اعمال تیک</button>
          <button id="clear-users-btn" class="btn danger">پاک کردن همه کاربران (دمو)</button>
          <button id="close-admin-btn" class="btn secondary">بستن</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
